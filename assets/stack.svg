<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <clipPath id="clip"><rect width="1200" height="300" rx="12"/></clipPath>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262D"/></pattern>
  
</defs>
<style>
  .in{animation:in .7s ease-out both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .soft{animation:soft 2.4s ease-in-out infinite}
  @keyframes soft{50%{opacity:.35}}</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="300" fill="#0D1117"/>
    <g class="in" style="animation-delay:0.10s">
      <text x="36" y="35" font-size="14" font-weight="600" fill="#8B949E">LLM &amp; Agents</text>
      <rect x="240" y="15" width="77" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="278.5" y="35" font-size="14" fill="#C9D1D9" text-anchor="middle">Claude</text><rect x="327" y="15" width="77" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="365.5" y="35" font-size="14" fill="#C9D1D9" text-anchor="middle">OpenAI</text><rect x="414" y="15" width="101" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="464.5" y="35" font-size="14" fill="#C9D1D9" text-anchor="middle">LangGraph</text><rect x="525" y="15" width="52" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="551" y="35" font-size="14" fill="#C9D1D9" text-anchor="middle">MCP</text>
    </g><line x1="32" y1="60" x2="1168" y2="60" stroke="#21262D"/>
    <g class="in" style="animation-delay:0.17s">
      <text x="36" y="95" font-size="14" font-weight="600" fill="#8B949E">Backend</text>
      <rect x="240" y="75" width="77" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="278.5" y="95" font-size="14" fill="#C9D1D9" text-anchor="middle">Python</text><rect x="327" y="75" width="85" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="369.5" y="95" font-size="14" fill="#C9D1D9" text-anchor="middle">FastAPI</text><rect x="422" y="75" width="85" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="464.5" y="95" font-size="14" fill="#C9D1D9" text-anchor="middle">Node.js</text>
    </g><line x1="32" y1="120" x2="1168" y2="120" stroke="#21262D"/>
    <g class="in" style="animation-delay:0.24s">
      <text x="36" y="155" font-size="14" font-weight="600" fill="#8B949E">Frontend</text>
      <rect x="240" y="135" width="85" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="282.5" y="155" font-size="14" fill="#C9D1D9" text-anchor="middle">Next.js</text><rect x="335" y="135" width="109" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="389.5" y="155" font-size="14" fill="#C9D1D9" text-anchor="middle">TypeScript</text>
    </g><line x1="32" y1="180" x2="1168" y2="180" stroke="#21262D"/>
    <g class="in" style="animation-delay:0.31s">
      <text x="36" y="215" font-size="14" font-weight="600" fill="#8B949E">Data</text>
      <rect x="240" y="195" width="109" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="294.5" y="215" font-size="14" fill="#C9D1D9" text-anchor="middle">PostgreSQL</text>
    </g><line x1="32" y1="240" x2="1168" y2="240" stroke="#21262D"/>
    <g class="in" style="animation-delay:0.38s">
      <text x="36" y="275" font-size="14" font-weight="600" fill="#8B949E">Ship &amp; Test</text>
      <rect x="240" y="255" width="77" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="278.5" y="275" font-size="14" fill="#C9D1D9" text-anchor="middle">Fly.io</text><rect x="327" y="255" width="109" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="381.5" y="275" font-size="14" fill="#C9D1D9" text-anchor="middle">Playwright</text>
    </g>
</g>
<rect x=".5" y=".5" width="1199" height="299" rx="12" fill="none" stroke="#21262D"/>
</svg>
